name: IntegrationTest
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:

jobs:
  test:
    name: ${{ matrix.package.repo }}/${{ matrix.package.group }}/${{ matrix.julia-version }}
    runs-on: ${{ matrix.os }}
    env:
      GROUP: GDAL
    strategy:
      fail-fast: false
      matrix:
        julia-version: [1]
        os: [ubuntu-latest]
        package:
          - {user: yeesian, repo: ArchGDAL.jl, group: GDAL}
          - {user: JuliaGeo, repo: GADM.jl, group: GDAL}
          - {user: evetion, repo: GeoDataFrames.jl, group: GDAL}
          - {user: rafaqz, repo: Rasters.jl, group: GDAL}

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: x64
      - uses: julia-actions/julia-buildpkg@v1
      - name: Clone Downstream
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.package.user }}/${{ matrix.package.repo }}
          path: downstream
      - name: Load this and run the downstream tests
        shell: julia --color=yes --project=downstream {0}
        run: |
          using Pkg, TOML
          try
            project_file = Pkg.project().path
            direct = haskey(Pkg.project().dependencies, "GDAL")
            # Force downstream tests to use this PR's version of the package
            Pkg.develop(PackageSpec(path="."))  # resolver may fail with main deps
            Pkg.update()
            project = TOML.parsefile(project_file)
            if !direct && haskey(project, "targets")
              # Make GDAL a test-only dependency, so downstream Aqua checks don't flag it
              # as stale or lacking compat. The manifest still tracks this PR's version.
              project["extras"]["GDAL"] = pop!(project["deps"], "GDAL")
              push!(project["targets"]["test"], "GDAL")
              project["compat"]["GDAL"] = TOML.parsefile("Project.toml")["version"]
              open(io -> TOML.print(io, project), project_file, "w")
            end
            Pkg.test(coverage=true)  # resolver may fail with test time deps
          catch err
            err isa Pkg.Resolve.ResolverError || rethrow()
            # If we can't resolve that means this is incompatible by SemVer and this is fine
            # it means we marked this as a breaking change, so we don't need to worry about
            # mistakenly introducing a breaking change, as we have intentionally made one
            @info "Not compatible with this release. No problem." exception=err
            exit(0)  # Exit immediately, as a success
          end
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
